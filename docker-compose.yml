# ============================================================================
# docker-compose.yml — AMR Resistance Prediction
#
# Perfiles:
#   docker compose --profile cpu up -d --build    # CPU
#   docker compose --profile gpu up -d --build    # GPU (requiere NVIDIA)
# ============================================================================

services:
  # ── CPU ───────────────────────────────────────────────────────────────────
  amr-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEVICE: cpu
    container_name: amr-dev
    profiles: ["cpu"]
    volumes:
      - .:/workspace:cached
    ports:
      - "8888:8888"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/workspace/src
    restart: unless-stopped

  # ── GPU ───────────────────────────────────────────────────────────────────
  amr-dev-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEVICE: gpu
    container_name: amr-dev-gpu
    profiles: ["gpu"]
    volumes:
      - .:/workspace:cached
    ports:
      - "8888:8888"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/workspace/src
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
